<div class="form-group">
    <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input id="username" type="text" formControlName="username" class="form-control">
            @if (getError('username')) {
            <div class="invalid-feedback d-block">{{ getError('username') }}</div>
            }
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input id="password" type="password" formControlName="password" class="form-control">
            @if (getError('password')) {
            <div class="invalid-feedback d-block">{{ getError('password') }}</div>
            }
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
</div>
