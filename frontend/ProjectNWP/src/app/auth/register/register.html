<form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
    <label for="username" class="form-label">Username:</label>
    <input type="text" id="username" formControlName="username" class="form-control">
    @if (getError('username')) {
      <div class="invalid-feedback d-block">{{ getError('username') }}</div>
    }
    </div>
    <div class="mb-3">
    <label for="password" class="form-label">Password:</label>
    <input type="password" id="password" formControlName="password" class="form-control">
    @if (getError('password')) {
      <div class="invalid-feedback d-block">{{ getError('password') }}</div>
    }
    </div>
    <div class="mb-3">
    <label for="email" class="form-label">Email:</label>
    <input type="email" id="email" formControlName="email" class="form-control">
    @if (getError('email')) {
      <div class="invalid-feedback d-block">{{ getError('email') }}</div>
    }
    </div>
    <div class="mb-3">
    <label for="name" class="form-label">Name:</label>
    <input type="text" id="name" formControlName="name" class="form-control">

      <div class="invalid-feedback d-block">{{ getError('name') }}</div>
    }
    </div>
    <div class="mb-3">
    <label for="surname" class="form-label">Surname:</label>
    <input type="text" id="surname" formControlName="surname" class="form-control">
    @if (getError('surname')) {
      <div class="invalid-feedback d-block">{{ getError('surname') }}</div>
    }
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
